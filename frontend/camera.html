<!DOCTYPE html>
<html>
<head>
<title>Camera Dashboard</title>
<style>
    :root {
        --bg: #0d1117;
        --panel: #161b22;
        --border: #30363d;
        --text: #e6edf3;
        --muted: #8b949e;
        --green: #3fb950;
        --red: #f85149;
    }

    * { box-sizing: border-box; }

    body {
        font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 24px 32px 48px;
    }

    header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 16px;
        margin-bottom: 24px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--border);
    }

    header h2 { margin: 0; font-size: 20px; font-weight: 600; }
    header .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }

    .controls { display: flex; gap: 10px; align-items: center; }

    button {
        padding: 10px 22px;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .start { background: var(--green); color: #04150a; }
    .stop  { background: var(--red); color: #2b0705; }

    #summary { font-size: 13px; color: var(--muted); }
    #summary b { color: var(--text); }

    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
        gap: 18px;
    }

    .camera {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
    }

    .camera-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px;
        border-bottom: 1px solid var(--border);
    }

    .camera-head h3 { margin: 0; font-size: 14px; font-weight: 600; }

    .badge {
        font-size: 11px;
        font-weight: 700;
        padding: 3px 9px;
        border-radius: 999px;
        letter-spacing: 0.03em;
        text-transform: uppercase;
    }
    .badge.stopped  { background: #30363d; color: var(--muted); }
    .badge.starting { background: #3a2f0f; color: #d29922; }
    .badge.running  { background: #0f3a1c; color: var(--green); }
    .badge.error    { background: #3a0f0f; color: var(--red); }

    .screen {
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .screen iframe { width: 100%; height: 100%; border: none; }
    .screen .placeholder { color: #30363d; font-size: 12px; }

    .empty {
        color: var(--muted);
        font-size: 14px;
        padding: 40px;
        text-align: center;
        border: 1px dashed var(--border);
        border-radius: 10px;
    }
</style>
</head>
<body>

<header>
    <div>
        <h2>Gujarat Police — Camera Dashboard</h2>
        <div class="sub" id="summary">Loading cameras…</div>
    </div>
    <div class="controls">
        <button class="start" id="startAllBtn" onclick="startAllCameras()">Start All</button>
        <button class="stop" id="stopAllBtn" onclick="stopAllCameras()">Stop All</button>
    </div>
</header>

<div class="grid" id="cameras"></div>

<script>
const API = "http://127.0.0.1:8000";
let cameras = [];

// -----------------------------
// LOAD CAMERAS
// -----------------------------
async function loadCameras() {
    const response = await fetch(`${API}/api/vendors/vendor/1/cameras`, { method: "GET" });
    const data = await response.json();
    cameras = data.cameras || [];
    renderGrid();
    updateSummary();
}

function renderGrid() {
    const container = document.getElementById("cameras");

    if (cameras.length === 0) {
        container.innerHTML = `<div class="empty">No cameras found.</div>`;
        return;
    }

    container.innerHTML = cameras.map(camera => `
        <div class="camera" id="cam-${camera.CameraID}">
            <div class="camera-head">
                <h3>${camera.CameraName}</h3>
                <span class="badge stopped" id="badge-${camera.CameraID}">Stopped</span>
            </div>
            <div class="screen" id="screen-${camera.CameraID}">
                <span class="placeholder">No signal</span>
            </div>
        </div>
    `).join("");
}

function setBadge(id, state, label) {
    const badge = document.getElementById(`badge-${id}`);
    badge.className = `badge ${state}`;
    badge.innerText = label;
}

function setScreen(id, webrtcUrl) {
    const screen = document.getElementById(`screen-${id}`);
    screen.innerHTML = webrtcUrl
        ? `<iframe src="${webrtcUrl}"></iframe>`
        : `<span class="placeholder">No signal</span>`;
}

function updateSummary() {
    const total = cameras.length;
    const running = document.querySelectorAll(".badge.running").length;
    document.getElementById("summary").innerHTML =
        `<b>${total}</b> camera${total === 1 ? "" : "s"} · <b>${running}</b> live`;
}

function setControlsEnabled(enabled) {
    document.getElementById("startAllBtn").disabled = !enabled;
    document.getElementById("stopAllBtn").disabled = !enabled;
}

// -----------------------------
// START ALL — fires every camera's /start in parallel and
// updates each card as its own response lands, so one slow or
// dead camera doesn't hold up the rest of the grid.
// -----------------------------
async function startAllCameras() {
    setControlsEnabled(false);

    await Promise.all(cameras.map(async camera => {
        const id = camera.CameraID;
        setBadge(id, "starting", "Starting");

        try {
            const response = await fetch(`${API}/api/camera/camera/${id}/start`, { method: "POST" });
            const data = await response.json();

            if (response.ok && data.webrtc_url) {
                setBadge(id, "running", "Live");
                setScreen(id, data.webrtc_url);
            } else {
                setBadge(id, "error", "Error");
            }
        } catch (e) {
            setBadge(id, "error", "Error");
        }

        updateSummary();
    }));

    setControlsEnabled(true);
}

// -----------------------------
// STOP ALL
// -----------------------------
async function stopAllCameras() {
    setControlsEnabled(false);

    await Promise.all(cameras.map(async camera => {
        const id = camera.CameraID;

        try {
            const response = await fetch(`${API}/api/camera/camera/${id}/stop`, { method: "POST" });
            if (response.ok) {
                setBadge(id, "stopped", "Stopped");
                setScreen(id, null);
            }
        } catch (e) {
            // leave badge as-is on failure
        }

        updateSummary();
    }));

    setControlsEnabled(true);
}

loadCameras();
</script>

</body>
</html>
